name: WeddingCull
options:
  bundleIdPrefix: com.weddingcull
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    AD_HOC_CODE_SIGNING_ALLOWED: "YES"

targets:
  WeddingCull:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_NAME: WeddingCull
        PRODUCT_BUNDLE_IDENTIFIER: com.weddingcull.WeddingCull
        INFOPLIST_FILE: Sources/WeddingCullApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/WeddingCullApp/WeddingCull.entitlements
        ARCHS: "$(ARCHS_STANDARD)"
        ONLY_ACTIVE_ARCH: "NO"

  WeddingCullTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/WeddingCullTests
      - path: Tools/TestDatasetGenerator/SyntheticWeddingGenerator.swift
    dependencies:
      - target: WeddingCull
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WeddingCull.app/Contents/MacOS/WeddingCull"
        BUNDLE_LOADER: "$(TEST_HOST)"

  WeddingCullIntegrationTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/WeddingCullIntegrationTests
      - path: Tools/TestDatasetGenerator/SyntheticWeddingGenerator.swift
    dependencies:
      - target: WeddingCull
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WeddingCull.app/Contents/MacOS/WeddingCull"
        BUNDLE_LOADER: "$(TEST_HOST)"

  WeddingCullUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/WeddingCullUITests
    dependencies:
      - target: WeddingCull

  TestDatasetGenerator:
    type: tool
    platform: macOS
    sources:
      - path: Tools/TestDatasetGenerator

  BenchmarkRunner:
    type: tool
    platform: macOS
    sources:
      - path: Tools/BenchmarkRunner
      - path: Tools/TestDatasetGenerator/SyntheticWeddingGenerator.swift
    dependencies:
      - target: WeddingCull

