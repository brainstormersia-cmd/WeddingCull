name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      benchmark_count:
        description: 'Number of photos for benchmark'
        required: false
        default: '1500'

jobs:
  build-and-release:
    name: Build, Package & Release (1500 Photos Verified)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: System Architecture Information
        run: |
          uname -m
          sw_vers

      - name: Make Scripts Executable
        run: chmod +x ./scripts/*.sh

      - name: Execute Full 1,500-Photo Verification Suite
        run: |
          echo "🚀 Executing MANDATORY 1,500-photo pipeline benchmark for release..."
          ./scripts/verify.sh --count "${{ github.event.inputs.benchmark_count || '1500' }}"

      - name: Perform Real Developer ID Code Signing & Notarization (if secrets present)
        id: codesign-step
        env:
          CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_BASE64 }}
          CERT_PWD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_PWD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [ -n "$CERT_BASE64" ] && [ -n "$CERT_PWD" ] && [ -n "$SIGNING_IDENTITY" ]; then
            echo "🔐 Apple Developer ID certificate detected. Setting up keychain..."
            KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
            KEYCHAIN_PWD=$(uuidgen)
            security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
            security default-keychain -s "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"

            echo "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$CERT_PWD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

            echo "✍️ Signing WeddingCull.app with Hardened Runtime..."
            codesign --force --options runtime --deep --sign "$SIGNING_IDENTITY" --entitlements Sources/WeddingCullApp/WeddingCull.entitlements build/Universal/WeddingCull.app

            echo "🔍 Verifying app code signature..."
            codesign --verify --deep --strict --verbose=2 build/Universal/WeddingCull.app

            echo "📦 Packaging signed DMG..."
            rm -f artifacts/WeddingCull-1.0.0.dmg
            hdiutil create -volname "WeddingCull" -srcfolder build/Universal/WeddingCull.app -ov -format UDZO artifacts/WeddingCull-1.0.0.dmg
            codesign --force --sign "$SIGNING_IDENTITY" artifacts/WeddingCull-1.0.0.dmg

            echo "🔍 Verifying DMG code signature..."
            codesign --verify --verbose=2 artifacts/WeddingCull-1.0.0.dmg

            if [ -n "$APP_PWD" ] && [ -n "$APPLE_ID" ] && [ -n "$TEAM_ID" ]; then
              echo "☁️ Submitting DMG to Apple Notary Service..."
              xcrun notarytool submit artifacts/WeddingCull-1.0.0.dmg --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PWD" --wait
              echo "📎 Stapling notarization ticket to DMG and App..."
              xcrun stapler staple artifacts/WeddingCull-1.0.0.dmg
              xcrun stapler staple build/Universal/WeddingCull.app
              echo "🔍 Validating notarization ticket on DMG..."
              xcrun stapler validate artifacts/WeddingCull-1.0.0.dmg
            fi

            echo "📦 Updating ZIP with signed application..."
            rm -f artifacts/WeddingCull-1.0.0-universal.zip
            (cd build/Universal && zip -q -r -y "../../artifacts/WeddingCull-1.0.0-universal.zip" WeddingCull.app)

            # Update verification report
            sed -i '' 's/"signed": false/"signed": true/g' artifacts/verification-report.json || true
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ No Apple Developer credentials configured in GitHub Secrets."
            echo "⚠️ Proceeding with ad-hoc build: ⚠️ UNSIGNED DEVELOPMENT BUILD — NOT NOTARIZED."
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Universal App Package
        uses: actions/upload-artifact@v4
        with:
          name: WeddingCull-1.0.0-universal-release
          path: |
            artifacts/WeddingCull-1.0.0-universal.zip
            artifacts/WeddingCull-1.0.0.dmg

      - name: Upload 1,500-Photo Verification & Benchmark Reports
        uses: actions/upload-artifact@v4
        with:
          name: WeddingCull-1500-Reports
          path: |
            artifacts/verification-report.json
            artifacts/benchmark.json
            BENCHMARKS.md

      - name: Upload Release Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            artifacts/WeddingCull-1.0.0-universal.zip
            artifacts/WeddingCull-1.0.0.dmg
            artifacts/verification-report.json
            artifacts/benchmark.json
            BENCHMARKS.md
          draft: false
          prerelease: false
          body: |
            ## WeddingCull 1.0.0 Universal Release

            * **Universal Binary**: macOS 13+ (Apple Silicon `arm64` + Intel `x86_64`)
            * **Offline AI**: 100% Local Vision & Core ML processing.
            * **Verified on 1,500 Photos**: Real benchmark measured and validated within RAM budget.
            * **Source Immutability**: Verified 100% byte-identical.
            * **Signing Status**: ${{ steps.codesign-step.outputs.has_signing == 'true' && '✅ Apple Developer ID Signed & Notarized' || '⚠️ UNSIGNED DEVELOPMENT BUILD — NOT NOTARIZED (Ad-Hoc Developer Build)' }}
