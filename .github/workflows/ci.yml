name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-apple-silicon:
    name: Test (Apple Silicon arm64)
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: System Architecture Information
        run: |
          echo "=== APPLE SILICON ARCHITECTURE AUDIT ==="
          ARCH=$(uname -m)
          echo "Detected architecture: $ARCH"
          sw_vers
          if [ "$ARCH" != "arm64" ]; then
            echo "❌ FATAL: Expected arm64 Apple Silicon runner, got $ARCH!"
            exit 1
          fi

      - name: Setup Environment
        run: |
          chmod +x ./scripts/*.sh
          ./scripts/bootstrap.sh

      - name: Run Unit & Integration Tests on Apple Silicon
        run: |
          ./scripts/test.sh --unit-only

      - name: Upload Test Results and Screenshots (arm64)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WeddingCull-Test-Artifacts-arm64
          path: |
            artifacts/screenshots/
            artifacts/*.xcresult*

  test-intel:
    name: Test (Intel x86_64)
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: System Architecture Information
        run: |
          echo "=== INTEL ARCHITECTURE AUDIT ==="
          ARCH=$(uname -m)
          echo "Detected architecture: $ARCH"
          sw_vers
          if [ "$ARCH" != "x86_64" ]; then
            echo "❌ FATAL: Expected x86_64 native Intel hardware runner, got $ARCH!"
            exit 1
          fi

      - name: Setup Environment
        run: |
          chmod +x ./scripts/*.sh
          ./scripts/bootstrap.sh

      - name: Run Unit & Integration Tests on Real Intel Architecture
        run: |
          ./scripts/test.sh --unit-only

      - name: Upload Test Results and Screenshots (Intel x86_64)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WeddingCull-Test-Artifacts-x86_64
          path: |
            artifacts/screenshots/
            artifacts/*.xcresult*

  test-ui:
    name: UI Automation Tests (macOS GUI)
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: System Architecture Information
        run: |
          echo "=== UI AUTOMATION ARCHITECTURE AUDIT ==="
          ARCH=$(uname -m)
          echo "Detected architecture: $ARCH"
          sw_vers

      - name: Setup Environment
        run: |
          chmod +x ./scripts/*.sh
          ./scripts/bootstrap.sh

      - name: Run UI Automation Tests
        run: |
          ./scripts/test.sh --ui-only

      - name: Upload UI Test Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WeddingCull-UI-Test-Artifacts
          path: |
            artifacts/screenshots/
            artifacts/*.xcresult*
            artifacts/*.json

  universal-build-and-verify:
    name: Universal Build & Verification (macOS)
    runs-on: macos-14
    timeout-minutes: 30
    needs: [test-apple-silicon, test-intel, test-ui]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: System Architecture Information
        run: |
          echo "=== ARCHITECTURE AUDIT ==="
          uname -m
          sw_vers

      - name: Download UI Test Artifacts
        uses: actions/download-artifact@v4
        with:
          name: WeddingCull-UI-Test-Artifacts
          path: artifacts
        continue-on-error: true

      - name: Make Scripts Executable
        run: chmod +x ./scripts/*.sh

      - name: Execute Full Verification Suite
        run: |
          ./scripts/verify.sh --count 250

      - name: Upload Universal App Package
        uses: actions/upload-artifact@v4
        with:
          name: WeddingCull-1.0.0-universal
          path: |
            artifacts/WeddingCull-1.0.0-universal.zip
            artifacts/WeddingCull-1.0.0.dmg

      - name: Upload Verification & Benchmark Reports
        uses: actions/upload-artifact@v4
        with:
          name: WeddingCull-Reports
          path: |
            artifacts/verification-report.json
            artifacts/benchmark.json
            artifacts/quality-benchmark-v2.json
            artifacts/QUALITY_BENCHMARK_V2.md
            BENCHMARKS.md

      - name: Upload Test Results and Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WeddingCull-Test-Artifacts
          path: |
            artifacts/screenshots/
            artifacts/*.xcresult*
